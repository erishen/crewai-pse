[project]
name = "crewai-pse"
version = "0.1.0"
description = "Task-agnostic Planner-Specialist-Evaluator (PSE) multi-agent framework powered by CrewAI; add tasks under tasks/"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crewai[litellm]>=0.80,<1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# run.py 内含大量中文 prompt 文本（三引号 f-string 与提示词列表），
# 断行会改变喂给 LLM 的提示内容、破坏防跑题机制，故对该文件豁免行长检查。
"tasks/project-articles/run.py" = ["E501"]
