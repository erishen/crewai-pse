[project]
name = "crewai-pse"
version = "0.1.0"
description = "Planner-Specialist-Evaluator three-role agent framework powered by CrewAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crewai[litellm]>=0.80,<1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
